<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>usta. — Eviniz etibarlı əllərdə</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#F8FAFC] text-[#0F172A] min-h-screen antialiased selection:bg-[#2D5A3C] selection:text-white">

    <!-- BİLDİRİŞLƏR (TOAST CONTAINER) -->
    <div id="toastContainer" class="fixed top-5 right-5 z-[100] flex flex-col gap-2.5 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

    <!-- =========================================================
         1. GİRİŞ VƏ QEYDİYYAT EKRANI (AUTH SECTION)
         ========================================================= -->
    <div id="authSection" class="min-h-screen flex items-center justify-center p-4 sm:p-6 bg-gradient-to-br from-slate-50 via-white to-emerald-50/40">
        <div class="w-full max-w-md bg-white rounded-3xl shadow-xl shadow-slate-200/60 border border-slate-100 p-7 sm:p-9 animate-fade-in">
            
            <!-- Loqo -->
            <div class="flex items-center justify-between mb-8">
                <div>
                    <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">usta<span class="text-[#2D5A3C]">.</span></h1>
                    <p class="text-[10px] font-bold tracking-[0.16em] text-slate-400 uppercase mt-1">EVİNİZ ETİBARLI ƏLLƏRDƏ</p>
                </div>
                <div class="w-11 h-11 rounded-2xl bg-[#2D5A3C]/10 text-[#2D5A3C] flex items-center justify-center">
                    <i data-lucide="wrench" class="w-5 h-5"></i>
                </div>
            </div>

            <!-- Tab Keçidi -->
            <div class="grid grid-cols-2 bg-slate-100 p-1 rounded-2xl mb-7">
                <button id="authTabLogin" onclick="switchAuthMode('login')"
                    class="py-2.5 text-sm font-bold rounded-xl bg-white text-slate-900 shadow-sm transition-all">
                    Daxil ol
                </button>
                <button id="authTabRegister" onclick="switchAuthMode('register')"
                    class="py-2.5 text-sm font-bold rounded-xl text-slate-500 hover:text-slate-800 transition-all">
                    Qeydiyyat
                </button>
            </div>

            <!-- GİRİŞ FORMU -->
            <form id="loginBox" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Telefon nömrəsi</label>
                    <div class="relative">
                        <i data-lucide="phone" class="w-4 h-4 text-slate-400 absolute left-4 top-1/2 -translate-y-1/2"></i>
                        <input id="loginPhone" type="tel" required placeholder="050 123 45 67"
                            class="input-field pl-11">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Şifrə</label>
                    <div class="relative">
                        <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-4 top-1/2 -translate-y-1/2"></i>
                        <input id="loginPassword" type="password" required placeholder="••••••••"
                            class="input-field pl-11 pr-11">
                        <button type="button" onclick="togglePassword('loginPassword', this)"
                            class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                            <i data-lucide="eye" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="btnLogin"
                    class="w-full h-12 bg-[#2D5A3C] hover:bg-[#22452E] active:scale-[0.99] text-white font-bold rounded-2xl shadow-lg shadow-[#2D5A3C]/20 transition-all flex items-center justify-center gap-2 mt-2">
                    <span>Hesaba daxil ol</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

            <!-- QEYDİYYAT FORMU -->
            <form id="registerBox" onsubmit="handleRegister(event)" class="hidden space-y-4">
                <!-- Rol Seçimi Kartları -->
                <div class="grid grid-cols-2 gap-3">
                    <label class="cursor-pointer">
                        <input type="radio" name="regRole" value="MUSTERI" checked onchange="toggleMasterInputs()" class="peer hidden">
                        <div class="p-3.5 rounded-2xl border-2 border-slate-200 peer-checked:border-[#2D5A3C] peer-checked:bg-[#2D5A3C]/5 transition-all flex flex-col items-center text-center gap-1.5">
                            <i data-lucide="user" class="w-5 h-5 text-slate-700"></i>
                            <span class="text-xs font-bold text-slate-800">Müştəriyəm</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="regRole" value="USTA" onchange="toggleMasterInputs()" class="peer hidden">
                        <div class="p-3.5 rounded-2xl border-2 border-slate-200 peer-checked:border-[#2D5A3C] peer-checked:bg-[#2D5A3C]/5 transition-all flex flex-col items-center text-center gap-1.5">
                            <i data-lucide="hard-hat" class="w-5 h-5 text-slate-700"></i>
                            <span class="text-xs font-bold text-slate-800">Ustayam</span>
                        </div>
                    </label>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Ad və Soyad</label>
                    <input id="regName" type="text" required placeholder="Məs: Əli Məmmədov" class="input-field">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Telefon</label>
                        <input id="regPhone" type="tel" required placeholder="0501234567" class="input-field">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Şəhər</label>
                        <input id="regCity" type="text" required placeholder="Məs: Bakı" class="input-field">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Şifrə</label>
                    <input id="regPassword" type="password" required placeholder="Minimum 6 simvol" class="input-field">
                </div>

                <!-- Yalnız Usta üçün əlavə sahələr -->
                <div id="masterExtraInputs" class="hidden space-y-3 pt-2 border-t border-slate-100 animate-fade-in">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">İxtisas / Sahə</label>
                            <select id="regCategory" class="input-field bg-white">
                                <option value="Santexnik">Santexnik</option>
                                <option value="Elektrik">Elektrik</option>
                                <option value="Mebel ustası">Mebel ustası</option>
                                <option value="Kombi/Kondisioner">Kombi/Kondisioner</option>
                                <option value="Təmir-tikinti">Təmir-tikinti</option>
                                <option value="Avto usta">Avto usta</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Təcrübə (il)</label>
                            <input id="regExperience" type="number" min="0" max="50" placeholder="Məs: 5" class="input-field">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Haqqınızda və xidmətlər</label>
                        <textarea id="regAbout" rows="2" placeholder="Gördüyünüz işlər haqqında qısa məlumat yazın..."
                            class="w-full p-3.5 rounded-2xl border border-slate-200 text-sm focus:outline-none focus:border-[#2D5A3C] transition"></textarea>
                    </div>
                </div>

                <button type="submit" id="btnRegister"
                    class="w-full h-12 bg-[#2D5A3C] hover:bg-[#22452E] text-white font-bold rounded-2xl shadow-lg shadow-[#2D5A3C]/20 transition-all">
                    Hesab yarat
                </button>
            </form>
        </div>
    </div>

    <!-- =========================================================
         2. ƏSAS TƏTBİQ PANELİ (DASHBOARD SECTION)
         ========================================================= -->
    <div id="dashboardSection" class="hidden min-h-screen flex flex-col pb-20 sm:pb-8">
        
        <!-- Üst Navbar -->
        <header class="bg-white/90 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-30">
            <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
                <div class="flex items-center gap-6">
                    <a href="#" onclick="resetToHome(); return false;" class="flex items-center gap-2">
                        <span class="text-2xl font-extrabold tracking-tight text-slate-900">usta<span class="text-[#2D5A3C]">.</span></span>
                        <span id="rolePill" class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-md bg-[#2D5A3C]/10 text-[#2D5A3C]"></span>
                    </a>

                    <!-- Desktop Naviqasiya Tabları -->
                    <nav id="desktopNav" class="hidden sm:flex items-center gap-1"></nav>
                </div>

                <div class="flex items-center gap-3">
                    <div onclick="switchTab('profile')" class="flex items-center gap-2.5 cursor-pointer hover:bg-slate-100 py-1.5 px-2.5 rounded-xl transition">
                        <img id="navAvatar" src="" alt="Avatar" class="w-8 h-8 rounded-full object-cover border border-slate-200">
                        <div class="hidden md:block text-left">
                            <p id="navUserName" class="text-xs font-bold text-slate-900 leading-none"></p>
                            <p id="navUserCity" class="text-[11px] text-slate-500 mt-0.5"></p>
                        </div>
                    </div>

                    <button onclick="logout()" title="Çıxış"
                        class="p-2 text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-xl transition">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Əsas Dinamik Məzmun -->
        <main id="mainContent" class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-6 space-y-6">
            <!-- JS tərəfindən doldurulacaq -->
        </main>

        <!-- Mobil Alt Naviqasiya Barı -->
        <nav id="mobileNav" class="sm:hidden fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 px-2 py-1.5 flex justify-around z-30"></nav>
    </div>

    <!-- =========================================================
         3. MODALLAR (DETALLI PROFİL, SİFARİŞ, CHAT, REYTİNQ, CAVAB)
         ========================================================= -->

    <!-- MODAL A: Detallı Usta Profili və Portfolio -->
    <div id="masterProfileModal" class="modal-backdrop hidden">
        <div class="modal-card max-w-2xl max-h-[90vh] flex flex-col">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                <h3 class="font-bold text-lg text-slate-900">Usta Profili və Portfolio</h3>
                <button onclick="closeModal('masterProfileModal')" class="modal-close-btn">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="masterProfileBody" class="p-6 overflow-y-auto space-y-6"></div>
        </div>
    </div>

    <!-- MODAL B: Yeni Sifariş Yaratmaq -->
    <div id="createOrderModal" class="modal-backdrop hidden">
        <div class="modal-card max-w-md">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                <div>
                    <h3 class="font-bold text-lg text-slate-900">Yeni Sifariş</h3>
                    <p id="orderTargetMasterName" class="text-xs font-semibold text-[#2D5A3C]"></p>
                </div>
                <button onclick="closeModal('createOrderModal')" class="modal-close-btn">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form onsubmit="submitOrder(event)" class="p-6 space-y-4">
                <input type="hidden" id="orderMasterId">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Problemin və ya işin təsviri *</label>
                    <textarea id="orderDescription" rows="3" required
                        placeholder="Məs: Mətbəx kranı su buraxır, dəyişdirilməlidir..."
                        class="w-full p-3.5 rounded-2xl border border-slate-200 text-sm focus:outline-none focus:border-[#2D5A3C]"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Ünvanınız *</label>
                    <input id="orderAddress" type="text" required
                        placeholder="Məs: Bakı, Yasamal r., İnşaatçılar pr. 42"
                        class="input-field">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Uyğun vaxt (istəyə bağlı)</label>
                    <select id="orderUrgency" class="input-field bg-white">
                        <option value="Bu gün təcili">Bu gün təcili</option>
                        <option value="Sabah gün ərzində">Sabah gün ərzində</option>
                        <option value="Həftəsonu">Həftəsonu</option>
                        <option value="Razılaşma yolu ilə">Razılaşma yolu ilə</option>
                    </select>
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="closeModal('createOrderModal')" class="flex-1 h-11 rounded-xl border border-slate-200 font-bold text-sm text-slate-600 hover:bg-slate-50">
                        Ləğv et
                    </button>
                    <button type="submit" id="btnSubmitOrder" class="flex-1 h-11 rounded-xl bg-[#2D5A3C] hover:bg-[#22452E] text-white font-bold text-sm">
                        Sifarişi Göndər
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL C: Usta Sifarişi Qəbul Edir və Qiymət Yazır -->
    <div id="acceptOrderModal" class="modal-backdrop hidden">
        <div class="modal-card max-w-sm">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                <h3 class="font-bold text-lg text-slate-900">Sifarişi Qəbul Et</h3>
                <button onclick="closeModal('acceptOrderModal')" class="modal-close-btn">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form onsubmit="submitAcceptOrder(event)" class="p-6 space-y-4">
                <input type="hidden" id="acceptOrderId">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Təklif olunan xidmət haqqı (AZN) *</label>
                    <input id="acceptOrderPrice" type="number" step="0.5" min="1" required placeholder="Məs: 35"
                        class="input-field text-lg font-bold">
                    <p class="text-[11px] text-slate-400 mt-1">Qiymət müştərinin ekranında görünəcək.</p>
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="closeModal('acceptOrderModal')" class="flex-1 h-11 rounded-xl border border-slate-200 font-bold text-sm text-slate-600">
                        Bağla
                    </button>
                    <button type="submit" class="flex-1 h-11 rounded-xl bg-[#2D5A3C] text-white font-bold text-sm">
                        Təsdiqlə
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL D: Müştəri Ulduz və Rəy Verir -->
    <div id="rateOrderModal" class="modal-backdrop hidden">
        <div class="modal-card max-w-md">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                <h3 class="font-bold text-lg text-slate-900">Xidməti Qiymətləndirin</h3>
                <button onclick="closeModal('rateOrderModal')" class="modal-close-btn">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form onsubmit="submitRating(event)" class="p-6 space-y-4">
                <input type="hidden" id="rateOrderId">
                <input type="hidden" id="selectedStarValue" value="5">

                <div class="text-center py-2">
                    <p class="text-xs font-bold text-slate-500 mb-2">Ustanın işinə neçə ulduz verirsiniz?</p>
                    <div id="starSelector" class="flex justify-center gap-2">
                        <!-- JS ilə 5 ulduz yaranacaq -->
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Rəyiniz (digər müştərilər üçün faydalıdır)</label>
                    <textarea id="rateReviewText" rows="3" placeholder="Usta vaxtında gəldi, işini səliqəli gördü..."
                        class="w-full p-3.5 rounded-2xl border border-slate-200 text-sm focus:outline-none focus:border-[#2D5A3C]"></textarea>
                </div>

                <button type="submit" class="w-full h-11 rounded-xl bg-[#2D5A3C] hover:bg-[#22452E] text-white font-bold text-sm">
                    Rəyi Göndər
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL E: Usta Rəyə Geri Dönüş (Cavab) Yazır -->
    <div id="replyReviewModal" class="modal-backdrop hidden">
        <div class="modal-card max-w-md">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                <h3 class="font-bold text-lg text-slate-900">Rəyə Cavab Yaz</h3>
                <button onclick="closeModal('replyReviewModal')" class="modal-close-btn">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form onsubmit="submitReply(event)" class="p-6 space-y-4">
                <input type="hidden" id="replyOrderId">
                <div id="replyCustomerQuote" class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-600 italic"></div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Sizin cavabınız *</label>
                    <textarea id="replyText" rows="3" required placeholder="Təşəkkür edirik, xoş günlərdə istifadə edin!"
                        class="w-full p-3.5 rounded-2xl border border-slate-200 text-sm focus:outline-none focus:border-[#2D5A3C]"></textarea>
                </div>
                <button type="submit" class="w-full h-11 rounded-xl bg-[#2D5A3C] text-white font-bold text-sm">
                    Cavabı Paylaş
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL F: Sifariş Daxili Canlı Chat -->
    <div id="chatModal" class="modal-backdrop hidden">
        <div class="modal-card max-w-lg h-[85vh] flex flex-col overflow-hidden">
            <!-- Chat Başlıq -->
            <div class="px-5 py-4 bg-white border-b border-slate-100 flex items-center justify-between">
                <div class="flex items-center gap-3 min-w-0">
                    <div class="w-10 h-10 rounded-full bg-[#2D5A3C]/10 text-[#2D5A3C] flex items-center justify-center shrink-0">
                        <i data-lucide="message-square" class="w-5 h-5"></i>
                    </div>
                    <div class="min-w-0">
                        <h3 id="chatHeaderTitle" class="font-bold text-sm text-slate-900 truncate">Sifariş Yazışması</h3>
                        <p id="chatHeaderSub" class="text-xs text-slate-500 truncate"></p>
                    </div>
                </div>
                <button onclick="closeChat()" class="modal-close-btn">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Mesajlar Siyahısı -->
            <div id="chatMessagesContainer" class="flex-1 p-4 overflow-y-auto space-y-3 bg-[#F1F5F9]"></div>

            <!-- Mesaj Yazma Paneli -->
            <div class="p-3 bg-white border-t border-slate-200 flex items-center gap-2">
                <label id="chatUploadBtn" class="cursor-pointer w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center shrink-0 transition" title="Şəkil göndər">
                    <i data-lucide="image-plus" class="w-5 h-5"></i>
                    <input type="file" id="chatImageInput" accept="image/*" class="hidden" onchange="handleChatImageUpload(this)">
                </label>
                <button type="button" onclick="sendChatLocation()" title="Konum göndər"
                    class="p-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 hover:text-[#2D5A3C] transition cursor-pointer shrink-0">
                    <i data-lucide="map-pin" class="w-5 h-5"></i>
                </button>
                <input id="chatMessageInput" type="text" placeholder="Mesajınızı yazın..."
                    onkeypress="if(event.key === 'Enter') sendChatMessage()"
                    class="flex-1 h-10 px-4 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-[#2D5A3C]">

                <button onclick="sendChatMessage()"
                    class="h-10 px-4 rounded-xl bg-[#2D5A3C] hover:bg-[#22452E] text-white font-bold text-sm flex items-center gap-1.5 shrink-0 transition">
                    <span>Göndər</span>
                    <i data-lucide="send" class="w-3.5 h-3.5"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL G: Tam Ekran Şəkil Baxışı (Lightbox) -->
    <div id="lightboxModal" onclick="closeModal('lightboxModal')" class="hidden fixed inset-0 bg-black/85 z-[90] flex items-center justify-center p-4 cursor-zoom-out">
        <img id="lightboxImage" src="" alt="Böyüdülmüş şəkil" class="max-w-full max-h-[90vh] rounded-2xl shadow-2xl object-contain">
    </div>

    <script src="app.js"></script>
</body>
</html>
